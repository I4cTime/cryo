name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Sync venv
        run: uv sync --frozen

      - name: Compile all sources
        run: uv run python -m compileall -q src

      # Hardware-free import smoke: these modules must import cleanly on any
      # machine (hardware is only touched at instantiation/daemon start).
      - name: Import smoke
        run: |
          uv run python -c "
          import cryo, cryo.paths, cryo.cli
          import cryo.daemon.config, cryo.daemon.gamesense, cryo.daemon.engine, cryo.daemon.server
          import cryo.hw.elc, cryo.hw.effects, cryo.hw.thermal
          print('imports ok', cryo.__version__)
          "

      - name: CLI help
        run: uv run cryoctl --help

      # Shared libraries PySide6's QtCore/QtGui/QtQuick/QtNetwork load
      # (GL/EGL, xkbcommon, fontconfig, D-Bus, GLib, Kerberos), so the
      # offscreen GUI smoke test runs here instead of skipping. Verified
      # sufficient on a bare ubuntu:24.04 image.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0t64 libgssapi-krb5-2

      - name: Tests
        run: uv run pytest -q -rs

      - name: Version consistency
        run: |
          uv run python - <<'PY'
          import tomllib, cryo
          with open("pyproject.toml", "rb") as f:
              py = tomllib.load(f)["project"]["version"]
          assert py == cryo.__version__, f"pyproject {py} != __init__ {cryo.__version__}"
          print("version", py)
          PY

  # Builds the release bundle and runs a real install, upgrade (rerun) and
  # uninstall on the runner. The runner has no Alienware hardware, so cryod
  # must exit 78 once and stay down.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Cache the pinned uv download
        uses: actions/cache@v6
        with:
          path: ~/.cache/cryo-bundle
          key: cryo-bundle-uv-${{ hashFiles('tools/build_bundle.py') }}

      - name: Build bundle
        run: uv run --no-project tools/build_bundle.py --out dist --uv-cache ~/.cache/cryo-bundle

      - name: Extract
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/cryo-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/bundle"
          echo "BUNDLE_DIR=$(echo "$RUNNER_TEMP"/bundle/cryo-*)" >> "$GITHUB_ENV"
          echo "VERSION=$(cat "$RUNNER_TEMP"/bundle/cryo-*/VERSION)" >> "$GITHUB_ENV"

      # pyusb needs the system libusb-1.0 (every desktop has it); without it
      # cryod crashes instead of reporting unsupported hardware.
      - name: libusb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libusb-1.0-0

      - name: Install
        run: cd "$BUNDLE_DIR" && sudo ./install.sh

      - name: Check install
        run: sudo tools/bundle_check.sh installed "$USER" "$VERSION"

      - name: Upgrade (rerun the installer)
        run: cd "$BUNDLE_DIR" && sudo ./install.sh

      - name: Check upgrade
        run: sudo tools/bundle_check.sh installed "$USER" "$VERSION"

      - name: Uninstall
        run: sudo /opt/cryo/uninstall.sh

      - name: Check uninstall
        run: sudo tools/bundle_check.sh uninstalled

      - name: Uninstall again (idempotent) with --purge
        run: sudo "$BUNDLE_DIR/uninstall.sh" --purge

      - name: Check purge
        run: sudo tools/bundle_check.sh purged
