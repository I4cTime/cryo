<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Cryo brand mark: six-fold ice crystal (hex lattice + spokes + frost
       branches) with the cyan core dot echoing the app's tray icon.
       Colors are canonical brand hex values; source of truth:
       apps/cryo/lib/palette.ts + app/globals.css @theme. The gradient is
       the AlienFX "Quantum" morph pair (cyan <-> violet). -->
  <defs>
    <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="120" y1="96" x2="392" y2="416">
      <stop offset="0" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#7B2DFF"/>
    </linearGradient>
    <filter id="cglow-wide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="cglow-tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <g id="cart">
      <g stroke="url(#cg)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- outer crystal hexagon -->
        <path d="M256 80L408.42 168V344L256 432L103.58 344V168Z" stroke-width="10"/>
        <!-- six spokes: inner facet vertex -> outer vertex -->
        <g stroke-width="9">
          <path d="M256 192L256 80"/>
          <path d="M311.42 224L408.42 168"/>
          <path d="M311.42 288L408.42 344"/>
          <path d="M256 320L256 432"/>
          <path d="M200.58 288L103.58 344"/>
          <path d="M200.58 224L103.58 168"/>
        </g>
        <!-- inner facet hexagon (crystal core) -->
        <path d="M256 192L311.42 224V288L256 320L200.58 288V224Z" stroke-width="6.5"/>
        <!-- frost branches at 62% of each spoke -->
        <g stroke-width="6.5">
          <path d="M285.44 130L256 147L226.56 130"/>
          <path d="M379.83 218.5L350.39 201.5L350.39 167.5"/>
          <path d="M379.83 293.5L350.39 310.5L350.39 344.5"/>
          <path d="M285.44 382L256 365L226.56 382"/>
          <path d="M132.17 293.5L161.61 310.5L161.61 344.5"/>
          <path d="M132.17 218.5L161.61 201.5L161.61 167.5"/>
        </g>
        <!-- lattice nodes on the hexagon edges -->
        <circle cx="408.42" cy="256" r="7.5" fill="url(#cg)" stroke="none"/>
        <circle cx="103.58" cy="256" r="7.5" fill="url(#cg)" stroke="none"/>
        <circle cx="332.21" cy="124" r="7.5" fill="url(#cg)" stroke="none"/>
        <circle cx="332.21" cy="388" r="7.5" fill="url(#cg)" stroke="none"/>
        <circle cx="179.79" cy="124" r="7.5" fill="url(#cg)" stroke="none"/>
        <circle cx="179.79" cy="388" r="7.5" fill="url(#cg)" stroke="none"/>
        <!-- cyan core: the tray dot -->
        <circle cx="256" cy="256" r="18" fill="#00D1FF" stroke="none"/>
      </g>
    </g>
  </defs>
  <use href="#cart" filter="url(#cglow-wide)" opacity="0.75"/>
  <use href="#cart" filter="url(#cglow-tight)" opacity="0.9"/>
  <use href="#cart"/>
</svg>
