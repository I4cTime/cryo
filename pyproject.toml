[project]
name = "cryo"
version = "0.2.0"
description = "Personal Alienware m18 R2 command center — thermals, fan curves, lighting, game-aware auto profiles"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pyusb>=1.2",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
cryod = "cryo.daemon.main:main"
cryoctl = "cryo.cli:main"
cryo-gui = "cryo.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryo"]
