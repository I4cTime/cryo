[project]
name = "cryo"
version = "0.3.1"
description = "Command center for Alienware and Dell G-Series laptops on Linux — thermals, fan curves, Thermal Guard, lighting, game-aware auto profiles"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11.2",
    "pyusb>=1.3.1",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
cryod = "cryo.daemon.main:main"
cryoctl = "cryo.cli:main"
cryo-gui = "cryo.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryo"]

[dependency-groups]
dev = [
    "pytest>=8",
]
